<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Class Schedule</title>
  <link rel="stylesheet" href="table.css">
</head>
<body>

  <table class="schedule" role="table" aria-label="Class schedule">
    <caption>My Class Schedule</caption>
    <thead>
      <tr>
        <th rowspan="2">Day</th>
        <th colspan="2">Time</th>
        <th rowspan="2">Topic</th>
      </tr>
      <tr>
        <th>Start</th>
        <th>End</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">Monday</td>
        <td>8:00 AM</td>
        <td>10:00 AM</td>
        <td>Introduction to Web Development I</td>
      </tr>
      <tr>
        <td>10:00 AM</td>
        <td>12:00 PM</td>
        <td>Introduction to Web Development II</td>
      </tr>

      <tr>
        <td rowspan="2">Tuesday</td>
        <td>8:00 AM</td>
        <td>10:00 AM</td>
        <td>Introduction to Single Page Applications I</td>
      </tr>
      <tr>
        <td>10:00 AM</td>
        <td>12:00 PM</td>
        <td>Introduction to Single Page Applications II</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
