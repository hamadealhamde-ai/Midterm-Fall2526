<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 - Order Form</title>
<link rel="stylesheet" href="tests.css">
</head>
<body>
  <form class="order-form">
    <h1>Great Auto Parts - Order Form</h1>

    <label for="first">First Name:</label>
    <input id="first" type="text" name="first">

    <label for="last">Last Name:</label>
    <input id="last" type="text" name="last">

    <label for="email">Email:</label>
    <input id="email" type="email" name="email">

    <label for="phone">Phone number:</label>
    <input id="phone" type="tel" name="phone">

    <label for="make">Make:</label>
    <input id="make" type="text" name="make">

    <label for="model">Model:</label>
    <input id="model" type="text" name="model">

    <label for="year">Year:</label>
    <input id="year" type="number" name="year">

    <label for="part">Spare Part:</label>
    <input id="part" type="text" name="part">

    <label for="qty">Quantity:</label>
    <input id="qty" type="number" name="quantity" min="1">

    <label for="comment">Comment:</label>
    <textarea id="comment" name="comment" rows="4"></textarea>

    <input type="submit" value="Submit Order">
  </form>
</body>
</html>
