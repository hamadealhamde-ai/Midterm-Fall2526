<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>
    <header>
        <h2><strong>Header</strong></h2>
    </header>
    <aside>
        <h2><strong>Slidebar</strong></h2>
        <p><small>Navigation or info</small></p>
    </aside>
    <form action="" method="post">
        <h2><strong>Registration Form</strong></h2>
        <label for="Name">Full Name:</label><br>
        <input type="text" id="Name" name="Name" placeholder="Enter your full name"><br>
        <label for="Email">Email:</label><br>
        <input type="email" name="Email" id="Email" placeholder="example@email.com"><br>
        <label for="Gender">Gender:</label><br>
        <select name="Gender" id="Gender">
            
        </select><br>
        <label for="Message">Massage:</label><br>
        <input type="text" id="Message" name="Massage" placeholder="Enter your massage"><br>
        <button>Submit</button>
    </form>
    <Footer>
        <h2><strong>Footer</strong></h2>
        <p><small> &copy; 2025 Web App Dev Test</small></p>
    </Footer>
</body>
</html>
