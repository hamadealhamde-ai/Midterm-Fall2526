<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="layout.css">
</head>
<body>
    <div class="Header">
            <h1>Header</h1>
    </div>
    <div class="Sidebar">
            <h1>Sidebar</h1>
            <p>Navigation or info</p>
    </div>
    <div class="Reg">
        <h1>Registration form</h1>
        <form action="POST">
        <label for="Fn">Full Name:</label>
        <br>
        <input type="text" id="Fn" value="Fn" placeholder="Enter your full name">
        <br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" value="email" placeholder="Enter your full name">
        <br>
        <label for="Gender">Gedner:</label>
        <option selected="Male"> Male</option>
        <option selected="Female">Female</option>
        <br>
        <label for="Message"> Message:</label>
        <br>
        <textarea placeholder="Message"></textarea>
        <br>
        <span class="Buttn"><input type="submit"></span>
        </form>
    </div>
    <div class="Footer">
        <h1>Footer</h1>
        <p>&copy; Web App Dev Test </p>
    </div>
    
</body>
</html>
