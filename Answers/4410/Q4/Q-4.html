<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>layout.html</title>
        <link rel="stylesheet" href="layout.css">
    </head>
    <body>
          
     <section id="header">
          <h1 style="text-align: center;">Header</h1>
     </section>
     <section id="sidebar">
            <h1 style="text-align: center;">sidebar</h1>
            <p style="text-align: center;"> nav or info</p>
        </section>
            <section id="contant">
              <h1 style="text-align: center;"> Registartion Form </h1>
              <form style="text-align: center;">
                <label for="Fname">Full Name:</label>
                <br>
                <input type="text" id="Fname" name="FullName" placeholder="Enter your full name" required>
                <br>
                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" name="Email" placeholder="Enter your email" required>
                <br>
                <label for="gender">Gender:</label>
                <br>
                <select id="gender" >
                    <option id="F">Femal</option>
                    <option id="M">Male</option>
                </select>
                <br>
                <label for="Msg">Message:</label>
                <br>
                <textarea id="Msg" placeholder="Enter your message">
                </textarea>
              </form>
            </section>
            <section id="footer">
              <h1 style="text-align: center;">Footer</h1>
         </section> 
    </body>
</html>
